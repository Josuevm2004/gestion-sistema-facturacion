spring.application.name=WebAppFacturacion

# Database Configuration (Azure SQL / MS SQL Server)
spring.datasource.url=jdbc:sqlserver://sistema-certificado-sql.database.windows.net:1433;databaseName=sistema_certificados;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
spring.datasource.username=admincertificado
spring.datasource.password=Josuevm_18
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Mail Configuration
