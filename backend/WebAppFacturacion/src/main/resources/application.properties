spring.application.name=WebAppFacturacion

# Database Configuration (CockroachDB / PostgreSQL 10GB Cloud Default)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:26257/defaultdb}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:notificaciones@facturacion.com}
spring.mail.password=${MAIL_PASSWORD:emailpassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security, JWT, Encryption & Webhook Secrets
jwt.secret=${JWT_SECRET:9a2f8c4e1b7d5a3f6e8c0b2d4f6a8c1e3b5d7f9a2c4e6b8d0f2a4c6e8b0d2f4a}
jwt.expiration-ms=86400000
