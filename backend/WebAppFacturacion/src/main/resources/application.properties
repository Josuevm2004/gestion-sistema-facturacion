spring.application.name=WebAppFacturacion

# Database Configuration (MySQL / phpMyAdmin Default)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_facturacion?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:josue123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (Resiliencia para Oracle Cloud & Cloud DB / CockroachDB / PostgreSQL / MySQL)
# Envia ping periódico cada 30s a conexiones inactivas para que el firewall de la nube o NAT no las corte en silencio
spring.datasource.hikari.keepalive-time=30000
# Renueva las conexiones cada 10 minutos (600000 ms) antes de que el servidor remoto o balanceador corte el socket
spring.datasource.hikari.max-lifetime=600000
# Tiempo maximo que una conexion inactiva puede permanecer en el pool (5 minutos)
spring.datasource.hikari.idle-timeout=300000
# Tiempo maximo para adquirir conexion antes de timeout (20 segundos)
spring.datasource.hikari.connection-timeout=20000
# Tiempo para validar que la conexion sigue viva antes de entregarla a una transaccion
spring.datasource.hikari.validation-timeout=3000
# Conexiones minimas siempre listas y vivas
spring.datasource.hikari.minimum-idle=2
# Conexiones maximas simultaneas
spring.datasource.hikari.maximum-pool-size=10
# Alerta si una consulta retiene una conexion mas de 45 segundos
spring.datasource.hikari.leak-detection-threshold=45000
# Nombre identificativo del pool
spring.datasource.hikari.pool-name=HikariPool-Facturacion

# JPA & Hibernate Settings (schema is read-only / frozen according to MYSQL_FINAL.sql)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Comprimir respuestas JSON grandes para reducir el tiempo de transferencia.
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/html,text/plain,text/css
server.compression.min-response-size=1024

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:notificaciones@facturacion.com}
spring.mail.password=${MAIL_PASSWORD:emailpassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security, JWT, Encryption & Webhook Secrets
jwt.secret=${JWT_SECRET:9a2f8c4e1b7d5a3f6e8c0b2d4f6a8c1e3b5d7f9a2c4e6b8d0f2a4c6e8b0d2f4a}
jwt.expiration-ms=86400000

# Dia operativo de vencimiento/cobro: 1. Puede cambiarse con MONTHLY_BILLING_DAY.
app.billing.monthly-billing-day=${MONTHLY_BILLING_DAY:1}

# Validacion publica de Clave SOL mediante el login web de SUNAT.
# No guardar aqui credenciales SOL de clientes.
sunat.validation.mode=${SUNAT_VALIDATION_MODE:web}
sunat.sol.web-login-url=${SUNAT_SOL_WEB_LOGIN_URL:}
