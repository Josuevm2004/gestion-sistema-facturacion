spring.application.name=WebAppFacturacion

# Database Configuration (MySQL / phpMyAdmin Default)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_facturacion?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:josue123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings (schema is read-only / frozen according to MYSQL_FINAL.sql)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:notificaciones@facturacion.com}
spring.mail.password=${MAIL_PASSWORD:emailpassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security, JWT, Encryption & Webhook Secrets
jwt.secret=${JWT_SECRET:9a2f8c4e1b7d5a3f6e8c0b2d4f6a8c1e3b5d7f9a2c4e6b8d0f2a4c6e8b0d2f4a}
jwt.expiration-ms=86400000

# Dia de corte mensual para vencimientos, prorrateos y proximos cobros.
app.billing.monthly-billing-day=${MONTHLY_BILLING_DAY:15}
