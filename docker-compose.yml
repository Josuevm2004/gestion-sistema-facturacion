version: '3.8'

services:
  backend:
    build:
      context: ./backend/WebAppFacturacion
      dockerfile: Dockerfile
    container_name: facturacion_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - AZURE_DB_HOST=${AZURE_DB_HOST:-facturacion-server.database.windows.net}
      - AZURE_DB_NAME=${AZURE_DB_NAME:-facturaciondb}
      - AZURE_DB_USER=${AZURE_DB_USER:-dbadmin}
      - AZURE_DB_PASSWORD=${AZURE_DB_PASSWORD:-SecretPassword123!}
      - JWT_SECRET=${JWT_SECRET:-9a2f8c4e1b7d5a3f6e8c0b2d4f6a8c1e3b5d7f9a2c4e6b8d0f2a4c6e8b0d2f4a}
      - AES_SECRET_KEY=${AES_SECRET_KEY:-MySuperSecretAESKeyForClaveSOL256!}
      - YAPE_WEBHOOK_SECRET=${YAPE_WEBHOOK_SECRET:-YapeWebhookHmacSecretKey2026!}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-notificaciones@facturacion.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-emailpassword}
    networks:
      - facturacion_net

  nginx:
    image: nginx:alpine
    container_name: facturacion_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - facturacion_net

networks:
  facturacion_net:
    driver: bridge
