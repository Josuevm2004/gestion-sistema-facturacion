version: '3.8'

services:
  backend-facturacion:
    build:
      context: ./backend/WebAppFacturacion
      dockerfile: Dockerfile
    container_name: backend-facturacion
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=America/Lima
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_BATCH_FETCH_SIZE=50
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m -XX:+UseContainerSupport -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m
      - SPRING_SQL_INIT_MODE=never
      - MONTHLY_BILLING_DAY=${MONTHLY_BILLING_DAY:-1}
      - SUNAT_VALIDATION_MODE=${SUNAT_VALIDATION_MODE:-web}
      - SUNAT_SOL_WEB_LOGIN_URL=${SUNAT_SOL_WEB_LOGIN_URL:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
