version: '3.8'

services:
  backend-facturacion:
    build:
      context: ./backend/WebAppFacturacion
      dockerfile: Dockerfile
    container_name: backend-facturacion
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=America/Lima
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - MONTHLY_BILLING_DAY=${MONTHLY_BILLING_DAY:-1}
      - SUNAT_GRE_AUTH_BASE_URL=${SUNAT_GRE_AUTH_BASE_URL:-https://api-seguridad.sunat.gob.pe/v1}
      - SUNAT_GRE_CLIENT_ID=${SUNAT_GRE_CLIENT_ID:-}
      - SUNAT_GRE_CLIENT_SECRET=${SUNAT_GRE_CLIENT_SECRET:-}
      - SUNAT_GRE_SCOPE=${SUNAT_GRE_SCOPE:-https://api-cpe.sunat.gob.pe}
